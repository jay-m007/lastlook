name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: check the shell hooks parse
        run: |
          bash -n hooks/lastlook.bash
          sudo apt-get install -y zsh >/dev/null && zsh -n hooks/lastlook.zsh
